name: Android APK (scan test)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q Meshly-Scan-Test-Updated.zip
      - name: Fix module version
        run: |
          sed -i "s/minSdkVersion 26/minSdkVersion 26\n    versionCode 1\n    versionName '1.0.0'/" meshly-scan-test/modules/meshly-connectivity/android/build.gradle
          cat meshly-scan-test/modules/meshly-connectivity/android/build.gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        working-directory: meshly-scan-test
        run: npm install --legacy-peer-deps
      - name: Build release APK
        working-directory: meshly-scan-test/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: meshly-scan-test-apk
          path: meshly-scan-test/android/app/build/outputs/apk/release/*.apk
